# ImageNet 256, class-conditional, TiTok-LL-32 VAE latent (d=512, N/d 2500) -- GENERATOR ONLY.
# Encoding and the 300k-step hierarchy assignment run on the local box (user's call,
# 2026-09-05); the assignment is uploaded to $R/imagenet/assign/ and this job waits for it.
#   download -> wait for the assignment file -> FID stats -> 8-GPU generator.
name: aag256_imagenet_titok
env:
  AAG_HF_ROOT: /mnt/shared/aag/hf
  HF_HOME: /mnt/shared/aag/hf_home
  HF_HUB_ENABLE_HF_TRANSFER: "0"
  R: /mnt/shared/aag/results_scale256
  D: /mnt/shared/aag/data
  ASSIGN: /mnt/shared/aag/results_scale256/imagenet_titok/assign/assign_cls_300k.pt
stages:
  - name: download
    cmd: >-
      mkdir -p $AAG_HF_ROOT $D/imagenet256 $R &&
      python -c "from huggingface_hub import snapshot_download as s;
      s('benjamin-paine/imagenet-1k-256x256', repo_type='dataset', local_dir='$AAG_HF_ROOT/imagenet-1k-256x256', allow_patterns=['data/*.parquet','README.md'], max_workers=16)" &&
      df -h /mnt/shared
  - name: fid_stats
    cmd: python scripts/compute_fid_stats_hf256.py --dataset imagenet256 --n 0 --out $D/imagenet256/fid_stats_train_full.npz
  - name: wait_assignment
    cmd: python cluster/wait_for_file.py $ASSIGN --hours 12
  - name: generator
    ddp: true
    cmd: >-
      python scripts/train_generator256_ddp.py --assignment $ASSIGN --dataset imagenet256
      --width 1.5 --n-res 3 --epochs 40 --batch 32 --lr 2e-4 --warmup 2000 --val-frac 0.01 --eval-every 2
      --fid-stats $D/imagenet256/fid_stats_train_full.npz --fid-n 10000 --log-every 200 --resume auto --out $R/imagenet_titok/gen_cls_300k
