# CelebA BEST recipe + inverse-cycle: wide hybrid 135M (aag173 plain ep800) + big critic 160 ep + squared-hinge floored cycle (fixed 0.1); control aag174 = 14.19 (current CelebA best).
# User (2026-09-05): adversary goes on the generator, not the AE; pipeline order = plain generator first, then extras.
name: aag256_celebahq_titok_hybridL_cyclefx_critic
env:
  AAG_HF_ROOT: /mnt/shared/aag/hf
  HF_HOME: /mnt/shared/aag/hf_home
  TORCH_HOME: /mnt/shared/aag/torch_hub
  HF_HUB_ENABLE_HF_TRANSFER: "0"
  R: /mnt/shared/aag/results_scale256
  D: /mnt/shared/aag/data
  ASSIGN: /mnt/shared/aag/results_scale256/celebahq_titok/assign_aag3/assign_aag3_k1_floor.pt
  RESUME: /mnt/shared/aag/results_scale256/celebahq_titok/gen_uncond_200k_dino_gm4_hybridL_aag3k1floor_800ep/checkpoints/gen_ep800.pt
stages:
  - name: download
    cmd: >-
      mkdir -p $AAG_HF_ROOT $D/celebahq256 $R &&
      python -c "from huggingface_hub import snapshot_download as s;
      s('korexyz/celeba-hq-256x256', repo_type='dataset', local_dir='$AAG_HF_ROOT/celeba-hq-256x256', allow_patterns=['data/*.parquet','README.md'], max_workers=16)"
  - name: wait_assignment
    cmd: python cluster/wait_for_file.py $ASSIGN --hours 1
  - name: fid_stats
    cmd: python scripts/compute_fid_stats_hf256.py --dataset celebahq256 --n 0 --out $D/celebahq256/fid_stats_train_28000.npz
  - name: generator
    ddp: true
    cmd: >-
      python scripts/train_generator256_ddp.py --assignment $ASSIGN --dataset celebahq256
      --n-classes 0 --arch hybrid --vit-dim 768 --vit-depth 12 --vit-heads 12 --vit-ztokens 8 --vit-patch 16 --z-bottleneck 64 --width 1.4 --mse-weight 1.0 --lpips-weight 0.5 --dino-weight 0.02 --resume $RESUME --reset-schedule --epochs 960 --batch 32 --lr 5e-5 --min-lr-frac 1.0 --warmup 500 --val-frac 0.02 --eval-every 2
      --fresh-gan-weight 1.0 --fresh-gan-layers 4 --fresh-gan-ndf 128 --fresh-critic-source gen_assigned --inverse $R/celebahq_titok/inverse/inverse_hybridL_aag173.pt --cycle-weight 0.1 --cycle-floor-mult 1.0 --cycle-floor-pow 2 --cycle-aug 1 --cycle-fixed
      --fid-stats $D/celebahq256/fid_stats_train_28000.npz --fid-n 10000 --log-every 100 --out $R/celebahq_titok/gen_uncond_200k_dino_gm4_hybridL_cyclefx_critic
