# CelebA-HQ 256, own AE d128 assignment, PUBLISHED generator recipe (flat z -> Linear -> 4x4 -> BatchNorm residual up-blocks) at 256: architecture A/B vs Generator256 (aag6).
# The assignment is made on the local box (user's call, 2026-09-05: "local dedicated to
# assignment and cluster for generator training") and uploaded to $R/celebahq/assign/.
#   download -> wait for the assignment file -> FID stats -> 8-GPU generator.
name: aag256_celebahq_dcae_d128_g4_c128_resid
env:
  AAG_HF_ROOT: /mnt/shared/aag/hf
  HF_HOME: /mnt/shared/aag/hf_home
  HF_HUB_ENABLE_HF_TRANSFER: "0"
  R: /mnt/shared/aag/results_scale256
  D: /mnt/shared/aag/data
  ASSIGN: /mnt/shared/aag/results_scale256/celebahq_dcae_d128_g4_c128/assign/assign_uncond_200k.pt
stages:
  - name: download
    cmd: >-
      mkdir -p $AAG_HF_ROOT $D/celebahq256 $R &&
      python -c "from huggingface_hub import snapshot_download as s;
      s('korexyz/celeba-hq-256x256', repo_type='dataset', local_dir='$AAG_HF_ROOT/celeba-hq-256x256', allow_patterns=['data/*.parquet','README.md'], max_workers=16)"
  - name: wait_assignment
    cmd: python cluster/wait_for_file.py $ASSIGN --hours 6
  - name: fid_stats
    cmd: python scripts/compute_fid_stats_hf256.py --dataset celebahq256 --n 0 --out $D/celebahq256/fid_stats_train_28000.npz
  - name: generator
    ddp: true
    cmd: >-
      python scripts/train_generator256_ddp.py --assignment $ASSIGN --dataset celebahq256
      --n-classes 0 --arch residual --ch 128 --epochs 400 --batch 32 --lr 2e-4 --warmup 2000 --val-frac 0.02 --eval-every 10
      --fid-stats $D/celebahq256/fid_stats_train_28000.npz --fid-n 10000 --log-every 100 --resume auto --out $R/celebahq_dcae_d128_g4_c128/gen_uncond_200k_resid
