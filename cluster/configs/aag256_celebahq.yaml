# CelebA-HQ 256, unconditional, one 8xB200 node:
#   download -> 8-way encode -> FID stats -> 200k-step assignment (GPU 0; ~30 min) -> 8-GPU generator.
name: aag256_celebahq
env:
  AAG_HF_ROOT: /mnt/shared/aag/hf
  HF_HOME: /mnt/shared/aag/hf_home
  HF_HUB_ENABLE_HF_TRANSFER: "0"
  R: /mnt/shared/aag/results_scale256
  D: /mnt/shared/aag/data
stages:
  - name: download
    cmd: >-
      mkdir -p $AAG_HF_ROOT $D/celebahq256 $R &&
      python -c "from huggingface_hub import snapshot_download as s;
      s('korexyz/celeba-hq-256x256', repo_type='dataset', local_dir='$AAG_HF_ROOT/celeba-hq-256x256', allow_patterns=['data/*.parquet','README.md'], max_workers=16)"
  - name: encode
    ddp: true
    cmd: python scripts/encode_hf256.py --dataset celebahq256 --amp --workers 12 --out $D/celebahq256/particles_dcae_f32c32.pt
  - name: merge
    cmd: python scripts/encode_hf256.py --dataset celebahq256 --merge --world 8 --out $D/celebahq256/particles_dcae_f32c32.pt
  - name: fid_stats
    cmd: python scripts/compute_fid_stats_hf256.py --dataset celebahq256 --n 0 --out $D/celebahq256/fid_stats_train_28000.npz
  - name: assign
    cmd: >-
      python scripts/run_assignment_classes.py --particles $D/celebahq256/particles_dcae_f32c32.pt --steps 200000
      --eval-every 5000 --eval-k 2048 --save-every 20000 --keep-checkpoints --out $R/celebahq/assign/assign_uncond_200k.pt
  - name: generator
    ddp: true
    cmd: >-
      python scripts/train_generator256_ddp.py --assignment $R/celebahq/assign/assign_uncond_200k.pt --dataset celebahq256
      --n-classes 0 --epochs 400 --batch 32 --lr 2e-4 --warmup 2000 --val-frac 0.02 --eval-every 10
      --fid-stats $D/celebahq256/fid_stats_train_28000.npz --fid-n 10000 --log-every 100 --out $R/celebahq/gen_uncond_200k
