# SEQUENTIAL (user request 2026-09-12): r64 -- 40 ep of MMD (CLS++patch fixed 0.5 x2, checkpoint ep440 of gen_uncond_200k_dino_gm4_fact_r64_mmd_160ep) THEN the big distributional critic (4L/128, w1.0 adaptive) for 160 ep at constant 5e-5. Compare with r64 x critic from plain (160 ep).
# User (2026-09-05): adversary goes on the generator, not the AE; pipeline order = plain generator first, then extras.
name: aag256_celebahq_titok_dino_gm4_seq_r64_mmd40_critic160
env:
  AAG_HF_ROOT: /mnt/shared/aag/hf
  HF_HOME: /mnt/shared/aag/hf_home
  TORCH_HOME: /mnt/shared/aag/torch_hub
  HF_HUB_ENABLE_HF_TRANSFER: "0"
  R: /mnt/shared/aag/results_scale256
  D: /mnt/shared/aag/data
  ASSIGN: /mnt/shared/aag/results_scale256/celebahq_titok/assign/assign_uncond_200k.pt
  RESUME: /mnt/shared/aag/results_scale256/celebahq_titok/gen_uncond_200k_dino_gm4_fact_r64_mmd_160ep/checkpoints/gen_ep440.pt
stages:
  - name: download
    cmd: >-
      mkdir -p $AAG_HF_ROOT $D/celebahq256 $R &&
      python -c "from huggingface_hub import snapshot_download as s;
      s('korexyz/celeba-hq-256x256', repo_type='dataset', local_dir='$AAG_HF_ROOT/celeba-hq-256x256', allow_patterns=['data/*.parquet','README.md'], max_workers=16)"
  - name: wait_assignment
    cmd: python cluster/wait_for_file.py $ASSIGN --hours 1
  - name: fid_stats
    cmd: python scripts/compute_fid_stats_hf256.py --dataset celebahq256 --n 0 --out $D/celebahq256/fid_stats_train_28000.npz
  - name: generator
    ddp: true
    cmd: >-
      python scripts/train_generator256_ddp.py --assignment $ASSIGN --dataset celebahq256
      --n-classes 0 --z-bottleneck 64 --mse-weight 1.0 --lpips-weight 0.5 --dino-weight 0.02 --resume $RESUME --reset-schedule --epochs 600 --batch 32 --lr 5e-5 --min-lr-frac 1.0 --warmup 500 --val-frac 0.02 --eval-every 2
      --fresh-gan-weight 1.0 --fresh-gan-layers 4 --fresh-gan-ndf 128 --fresh-critic-source gen_assigned
      --fid-stats $D/celebahq256/fid_stats_train_28000.npz --fid-n 10000 --log-every 100 --out $R/celebahq_titok/gen_uncond_200k_dino_gm4_seq_r64_mmd40_critic160
